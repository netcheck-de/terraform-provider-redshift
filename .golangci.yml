---
version: "2"

linters:
  default: standard
  enable:
    - durationcheck
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - testifylint
    - thelper
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - check-private-receivers
        - name: package-comments
        - name: var-naming

formatters:
  enable:
    - gofmt
