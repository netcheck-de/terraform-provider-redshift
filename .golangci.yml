---
version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - depguard
    - durationcheck
    - embeddedstructfieldcheck
    - errname
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godoclint
    - godot
    - godox
    - iface
    - inamedparam
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sqlclosecheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    depguard:
      rules:
        # Resources use Redshift SQL semantics through sqlclient; only provider wiring constructs transports.
        sql-transport:
          files:
            - '**/internal/provider/*.go'
            - '!**/internal/provider/provider.go'
            - '!**/internal/provider/connection.go'
            - '!**/internal/provider/connection_config.go'
            - '!$test'
          deny:
            - pkg: github.com/netcheck-de/terraform-provider-redshift/internal/redshiftdata
              desc: construct SQL transports only in provider wiring (provider.go, connection*.go)
            - pkg: github.com/netcheck-de/terraform-provider-redshift/internal/redshiftconn
              desc: construct SQL transports only in provider wiring (provider.go, connection*.go)
            - pkg: github.com/aws/aws-sdk-go-v2/service
              desc: AWS service clients belong to provider wiring
            - pkg: github.com/jackc/pgx
              desc: pgx belongs to the direct SQL transport
    godoclint:
      # The default rules plus a doc comment on every declaration, unexported ones and tests included.
      enable:
        - require-doc
      options:
        require-doc:
          ignore-unexported: false
        start-with-name:
          include-unexported: true

formatters:
  enable:
    - gci
    - gofumpt
