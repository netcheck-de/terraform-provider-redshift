---
version: 2
project_name: terraform-provider-redshift

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - '{{ .Env.GPG_FINGERPRINT }}'
      - --output
      - '${signature}'
      - --detach-sign
      - '${artifact}'

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

# Release notes are generated from Conventional Commit subjects since the previous tag.
changelog:
  use: github
  groups:
    - title: Breaking changes
      regexp: '^\w+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: Documentation
      regexp: '^docs(\([^)]*\))?:'
      order: 3
    - title: Dependencies
      regexp: '^build\(deps\):'
      order: 4
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^(test|ci|chore|style|refactor)(\([^)]*\))?:'
      # Drop build commits except build(deps) dependency updates (RE2 has no lookahead).
      - '^build(\([^d)][^)]*\))?:'
      - '^Merge '
