---
version: '3'

vars:
  # The newest release tag is the only version source; the fallback must satisfy the examples' "~> 0.2" constraint.
  VERSION:
    sh: git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' | grep . || echo 0.2.0
  PACKAGE_DIR: '{{.ROOT_DIR}}/.cache/mirror/registry.terraform.io/netcheck-de/redshift/{{.VERSION}}/{{OS}}_{{ARCH}}'
  TF_DIR: '{{.ROOT_DIR}}/examples/complete'
  # CI and local runs use the same golangci-lint release, pinned in .golangci-lint-version.
  GOLANGCI_LINT_VERSION:
    sh: cat .golangci-lint-version
  GOLANGCI_LINT: '{{.ROOT_DIR}}/.cache/tools/golangci-lint/{{.GOLANGCI_LINT_VERSION}}/golangci-lint'

tasks:

  # Checks

  check:
    desc: Check formatting, lint, offline tests, and documentation
    cmds:
      - task: lint
      - task: markdown-fmt-check
      - task: test
      - task: docs-check

  # Go

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  lint:
    desc: Run the pinned golangci-lint release
    deps: [golangci-lint:install]
    cmds:
      - '"{{.GOLANGCI_LINT}}" run ./...'

  lint-fix:
    desc: Apply golangci-lint autofixes
    deps: [golangci-lint:install]
    cmds:
      - '"{{.GOLANGCI_LINT}}" run --fix ./...'

  golangci-lint:install:
    internal: true
    # The official installer, taken from the pinned release tag, verifies the archive checksum.
    # The install path contains the version, so a version bump installs into a new directory.
    status: ['test -x "{{.GOLANGCI_LINT}}"']
    cmds:
      - >-
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/{{.GOLANGCI_LINT_VERSION}}/install.sh
        | sh -s -- -b "$(dirname "{{.GOLANGCI_LINT}}")" {{.GOLANGCI_LINT_VERSION}}

  test:
    desc: Run offline race tests and print statement coverage
    cmds:
      - go test -race -cover ./...

  golden:
    desc: Rewrite golden SQL files under internal/provider/testdata/sql; review the diff before committing
    cmds:
      - go test ./internal/provider -run 'SQL|Transcript' -update

  actionlint:
    desc: Lint GitHub Actions workflows
    cmds:
      - go tool actionlint -color

  # Documentation

  markdown-fmt:
    desc: Format Markdown files
    shopt: [globstar]
    cmds:
      - >-
        go tool mdox fmt
        --soft-wraps
        *.md examples/**/*.md

  markdown-fmt-check:
    desc: Check Markdown formatting
    shopt: [globstar]
    cmds:
      - >-
        go tool mdox fmt --check
        --soft-wraps
        *.md examples/**/*.md

  docs:
    desc: Generate Registry documentation
    cmds:
      - go tool tfplugindocs generate --provider-name redshift

  docs-check:
    desc: Validate Registry documentation and check that docs/ matches freshly generated output
    cmds:
      - go tool tfplugindocs validate --provider-name redshift --provider-dir .
      - rm -rf .cache/docs-check
      - >-
        go tool tfplugindocs generate
        --provider-name redshift
        --rendered-website-dir .cache/docs-check
      - diff -r docs .cache/docs-check

  # Local build

  build:
    desc: Build a local provider mirror and isolated Terraform CLI configuration
    cmds:
      - mkdir -p "{{.PACKAGE_DIR}}"
      - go build -ldflags="-X main.version={{.VERSION}}" -o "{{.PACKAGE_DIR}}/terraform-provider-redshift"
      - |
        cat > "{{.ROOT_DIR}}/.cache/dev.tfrc" <<EOF
        provider_installation {
          dev_overrides {
            "netcheck-de/redshift" = "{{.PACKAGE_DIR}}"
          }
          filesystem_mirror {
            path    = "{{.ROOT_DIR}}/.cache/mirror"
            include = ["netcheck-de/redshift"]
          }
          direct {
            exclude = ["netcheck-de/redshift"]
          }
        }
        EOF

  # Terraform examples

  terraform:
    desc: Run Terraform against TF_DIR with the local provider (default examples/complete)
    deps: [build]
    dir: '{{.TF_DIR}}'
    env:
      TF_CLI_CONFIG_FILE: '{{.ROOT_DIR}}/.cache/dev.tfrc'
    cmds:
      - terraform {{.CLI_ARGS}}

  terraform-check:
    desc: Check formatting and validate all Terraform examples with the local provider
    deps: [build]
    env:
      TF_CLI_CONFIG_FILE: '{{.ROOT_DIR}}/.cache/dev.tfrc'
    cmds:
      - terraform fmt -check -recursive examples
      - |
        set -e
        for example in examples/*/; do
          [ -f "$example/main.tf" ] || continue
          terraform -chdir="$example" init -backend=false
          terraform -chdir="$example" validate
        done

  terraform-test:
    desc: Run mocked Terraform example tests in TF_DIR (default examples/complete)
    deps: [build]
    dir: '{{.TF_DIR}}'
    env:
      TF_CLI_CONFIG_FILE: '{{.ROOT_DIR}}/.cache/dev.tfrc'
    cmds:
      - terraform init -backend=false -input=false
      - terraform test {{.CLI_ARGS}}

  # Release

  snapshot:
    desc: Build unsigned release archives locally
    cmds:
      - goreleaser release --snapshot --clean --skip=publish,sign
