---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      terraform-plugin:
        patterns: ['github.com/hashicorp/terraform-plugin-*']
      aws-sdk:
        patterns: ['github.com/aws/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
