---
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The main-branch check and the commit-based release notes need full history and tags.
          fetch-depth: 0

      - name: Require a SemVer tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $TAG is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $TAG is not on main" >&2; exit 1; }

  checks:
    name: Release checks
    needs: guard
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish signed provider
    needs: [guard, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The main-branch check and the commit-based release notes need full history and tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Import signing key
        id: signing-key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.signing-key.outputs.fingerprint }}
