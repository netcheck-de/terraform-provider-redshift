---
name: Complete example

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: redshift-dev-complete
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  example:
    name: Validate complete example
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: examples/complete
    env:
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.cache/dev.tfrc
      TF_VAR_name_prefix: redshift-ci-complete
    steps:
      - name: Configure deployment variables
        working-directory: ${{ github.workspace }}
        run: |
          echo '::add-mask::${{ vars.AWS_ROLE_ARN }}'
          echo '::add-mask::${{ vars.AWS_REGION }}'
          echo '::add-mask::${{ vars.TF_STATE_BUCKET }}'
          {
            echo 'TF_VAR_region=${{ vars.AWS_REGION }}'
            echo 'TF_STATE_BUCKET=${{ vars.TF_STATE_BUCKET }}'
          } >> "$GITHUB_ENV"

      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Build provider
        working-directory: ${{ github.workspace }}
        run: task build VERSION="${GITHUB_REF_NAME#v}"

      - name: Initialize Terraform
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {
              key          = "terraform-provider-redshift/live/complete.tfstate"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Apply infrastructure
        run: terraform apply -input=false -auto-approve

      - name: Require an empty plan
        run: terraform plan -input=false -detailed-exitcode

      # Redshift rejects DROP DATABASE while its zero-ETL integration exists. Read state rather than outputs so cleanup
      # also handles a failed apply that created the integration but did not finish the destination database.
      - name: Delete zero-ETL integration
        if: always()
        run: bash delete-zero-etl.sh .

      - name: Destroy infrastructure
        if: always()
        run: terraform destroy -input=false -auto-approve
