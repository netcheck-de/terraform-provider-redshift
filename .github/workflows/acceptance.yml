---
name: Acceptance

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: redshift-dev-acceptance
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  acceptance:
    name: Live acceptance tests
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_DIR: tests/acceptance/infra
      TF_VAR_name_prefix: redshift-ci-acceptance
      # Fixture Terraform must install the pinned release, not inherit development overrides.
      TF_CLI_CONFIG_FILE: /dev/null
      TF_ACC: '1'
      REDSHIFT_ACC_DIRECT: '1'
    steps:
      - name: Configure deployment variables
        run: |
          echo '::add-mask::${{ vars.AWS_ROLE_ARN }}'
          echo '::add-mask::${{ vars.AWS_REGION }}'
          echo '::add-mask::${{ vars.TF_STATE_BUCKET }}'
          {
            echo 'TF_VAR_region=${{ vars.AWS_REGION }}'
            echo 'TF_STATE_BUCKET=${{ vars.TF_STATE_BUCKET }}'
          } >> "$GITHUB_ENV"

      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure runner SQL ingress
        run: |
          ip=$(curl --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com)
          echo "TF_VAR_runner_cidr=$ip/32" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Apply infrastructure
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Export acceptance fixture inputs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output -json acceptance | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Run acceptance tests
        run: go test ./internal/provider -run '^TestAcc' -count=1 -v -timeout=0

      - name: Destroy infrastructure
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -input=false -auto-approve
