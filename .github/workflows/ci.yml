---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

  lint-project:
    name: Project lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3

      - name: Markdown lint
        uses: nosborn/github-action-markdown-cli@v3
        with:
          files: .

      - name: Check Markdown formatting
        run: task markdown-fmt-check

      - name: Actionlint
        run: task actionlint

  test-go:
    name: Go tests (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: &terraform-versions ["~1.16.0", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Test
        run: task test

  test-terraform:
    name: Terraform validation (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: *terraform-versions
    steps:
      # Tags give the local build a version matching the examples' constraint, which older Terraform releases enforce
      # for development overrides.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Validate examples
        run: task terraform-check

      - name: Test example composition
        run: task terraform-test

      - name: Validate and check generated Registry documentation
        run: task docs-check

  # The required checks name these jobs, so each one reports the result of its whole Terraform version matrix.
  go-tests:
    name: Go tests
    needs: test-go
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Terraform version
        run: test "${{ needs.test-go.result }}" = success

  terraform-validation:
    name: Terraform validation
    needs: test-terraform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Terraform version
        run: test "${{ needs.test-terraform.result }}" = success

  build:
    name: Build release archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build unsigned snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,sign

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: provider-snapshot
          path: |
            dist/*.zip
            dist/*_SHA256SUMS
            terraform-registry-manifest.json
